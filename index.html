<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IDCH · Turnos</title>
<style>
:root{--ink:#10151C;--mut:#5B6675;--line:#DDE4EE;--blue:#0A72F0;--soft:#E8F1FF;--mist:#F3F6FA;--ok:#0F7B55;--okb:#E3F5EC;--warn:#A86400;--warnb:#FFF1D6;--red:#C62F3B;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}#app{height:100%}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--mist);color:var(--ink);font:16px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif}
.w{max-width:960px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:14px}
.brand{text-decoration:none;color:var(--ink);display:flex;flex-direction:column;line-height:1.05}.brand b{font:800 1.6rem Georgia,serif;letter-spacing:.03em;color:var(--blue)}.brand span{font-size:.76rem;color:var(--mut)}
.st{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--mut)}.dot{width:10px;height:10px;border-radius:50%;background:#9AA5B4}.dot.on{background:var(--ok);box-shadow:0 0 0 4px var(--okb)}.dot.off,.dot.dup{background:var(--warn);box-shadow:0 0 0 4px var(--warnb)}
h1{margin:.4rem 0 .8rem;font-size:1.8rem;letter-spacing:-.01em}h2{margin:1.2rem 0 .5rem;font-size:1.15rem}h3{margin:.2rem 0 .5rem}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 1px 2px rgba(16,21,28,.05)}
.b{border:1.5px solid #C3CCD8;border-radius:12px;background:#fff;color:var(--ink);font-weight:600;font-size:1rem;font-family:inherit;padding:.65rem 1rem;min-height:46px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;transition:background .15s,transform .05s}
.b:hover{background:var(--mist)}.b:active{transform:scale(.98)}
.b.pri{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(10,114,240,.28)}.b.pri:hover{background:#0860CC}
.b.dng{border-color:var(--red);color:var(--red)}.b.dng.arm{background:var(--red);color:#fff}
.b.big{font-size:1.15rem;min-height:64px;flex:1 1 200px}.b.sm{min-height:36px;padding:.25rem .8rem;font-size:.9rem}
.b:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.tabs{background:#E4EAF3;padding:4px;border-radius:14px;gap:4px;flex-wrap:nowrap}.tabs .b{flex:1 1 0;border:0;background:transparent;min-height:42px}.tabs .b.on{background:#fff;box-shadow:0 1px 4px rgba(16,21,28,.15);color:var(--blue)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0;align-items:center}
input,select{width:100%;padding:.7rem;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit;margin:.2rem 0 .8rem}
label{display:block;font-weight:600}:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.mut{color:var(--mut)}.err{color:var(--red);font-weight:600;min-height:1.2em}.okm{color:var(--ok);font-weight:600}
.num{font-size:4.2rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--blue)}
.tag{font-style:normal;font-size:.72rem;font-weight:700;background:var(--soft);color:var(--blue);border-radius:99px;padding:.1rem .6rem;margin-left:.5rem}
.nx,.ls,.rc{list-style:none;margin:0;padding:0}.ls li,.nx li,.rc li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:.5rem 0;border-bottom:1px solid var(--line)}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.mc{border:1px solid var(--line);border-left:5px solid #C3CCD8;border-radius:12px;padding:.7rem .8rem;display:grid;gap:2px;background:#fff}.mc.on{border-left-color:var(--blue);background:var(--soft)}.mc.off{border-left-color:#D99A2B;background:var(--warnb)}
.mc span{font-weight:700;color:var(--ok)}.mc.on span{color:var(--blue)}.mc.off span{color:var(--warn)}.mc small{color:var(--mut)}
.w a:not(.b){color:var(--blue)}hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.tv{min-height:100%;height:100%;display:grid;grid-template-columns:1.45fr 1fr;background:#fff}
.now{background:var(--ink);color:#fff;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:3vw;gap:1vw;border-right:1.2vw solid var(--blue)}.now small{font-size:2.4vw;color:#9FB0C6}
.nn{font-size:17vw;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}.mm{font-size:4.8vw;font-weight:700;color:#7FB6FF}
.now.flash{animation:fl .8s 5}@keyframes fl{50%{background:#173A6B}}
.tvm{display:grid;grid-template-columns:repeat(auto-fit,minmax(11vw,1fr));gap:.8vw;margin-top:2.4vw}.tvm div{border:1px solid #2A3646;border-radius:1vw;padding:.8vw;display:grid;gap:.2vw}.tvm b{font-size:1.3vw;color:#9FB0C6;font-weight:600}.tvm span{font-size:2vw;font-weight:800;color:#6FD6A8}.tvm .on{border-color:var(--blue);background:#12294A}.tvm .on span{color:#fff}.tvm .off span{color:#F0B558}
.tv aside{padding:2vw 2.4vw;overflow:hidden}.logo{width:30%;display:block;margin:0 auto 1vw}
.tv h2{font-size:2.6vw;margin:1vw 0 .4vw}.tv .nx li{font-size:3.4vw;font-weight:800}.tv .nx small{font-size:1.6vw;font-weight:600}.tv h3{font-size:1.5vw;color:var(--mut);margin-top:2vw}.tv .rc li{font-size:1.8vw;color:var(--mut)}
.tvs{position:fixed;left:1vw;bottom:1vw;background:var(--warnb);color:var(--warn);font-weight:700;padding:.5vw 1vw;border-radius:99px;font-size:1.3vw}
.ov{position:fixed;left:50%;bottom:1.6vw;transform:translateX(-50%);background:var(--blue);color:#fff;font-weight:700;font-size:max(1rem,1.5vw);font-family:inherit;border:0;border-radius:99px;padding:.7vw 2vw;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.back{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);right:8px;z-index:10;font-size:.8rem;color:var(--ink);background:#fff;padding:.3rem .6rem;border-radius:8px;text-decoration:none;border:1px solid var(--line);opacity:.5}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:700px){.tv{grid-template-columns:1fr;height:auto}.now{border-right:0;border-bottom:3vw solid var(--blue);padding:8vw 4vw}.nn{font-size:30vw}.mm{font-size:9vw}.now small{font-size:5vw}.tvm{grid-template-columns:1fr 1fr}.tvm b{font-size:3.4vw}.tvm span{font-size:5vw}.tv aside{padding:5vw}.tv h2{font-size:6vw}.tv .nx li{font-size:7vw}.tv .nx small{font-size:3.4vw}.tv h3{font-size:4vw}.tv .rc li{font-size:4.5vw}.tvs{font-size:3.2vw}.tabs .b{font-size:.85rem;padding:.3rem}}
.mm small{display:block;font-size:2.6vw;color:#B9D6FF;font-weight:600}.tvm small{font-size:1.15vw;color:#9FB0C6;min-height:1.4em}.tvm .dis{opacity:.55}.tvm .dis span{color:#9FB0C6;font-size:1.5vw}button.mc{font:inherit;text-align:left;cursor:pointer;color:var(--ink)}button.mc:disabled{opacity:.5;cursor:not-allowed}.mc.sel{outline:3px solid var(--blue)}input[type=checkbox]{width:auto;margin:0}summary{cursor:pointer;margin-bottom:.6rem}@media (max-width:700px){.mm small{font-size:5vw}.tvm small{font-size:3vw}}.cq{display:grid;gap:1.4vw;width:100%}.cc{border:.25vw solid #2A3646;border-radius:2vw;padding:1.2vh 2vw;opacity:.5}.cc.cur{opacity:1;border-color:var(--blue);background:#12294A;animation:fl .9s infinite}.cc small{display:block;font-size:1.8vw;color:#9FB0C6}.cn{font-size:min(11vw,22vh);font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}.cq.n2 .cn{font-size:min(8vw,13vh)}.cq.n3 .cn{font-size:min(5.6vw,9vh)}.cm{font-size:min(3.4vw,5.5vh);font-weight:700;color:#7FB6FF}.cq.n2 .cm{font-size:min(3vw,4.4vh)}.cq.n3 .cm{font-size:min(2.4vw,3.6vh)}.cm small{font-size:min(1.9vw,3vh);color:#B9D6FF}.cq.n3 .cc>small{display:none}.pn{display:block;font-weight:600}@media (max-width:700px){.cn{font-size:22vw!important}.cm{font-size:7vw!important}.cc small,.cm small{font-size:4vw!important}}
.cq .cn.nm{font-size:min(7vw,13vh);line-height:1.1;letter-spacing:0;overflow-wrap:anywhere}.cq.n2 .cn.nm{font-size:min(5.4vw,9vh)}.cq.n3 .cn.nm{font-size:min(4vw,6.4vh)}.nn.nm{font-size:min(8vw,14vh);line-height:1.1;letter-spacing:0;overflow-wrap:anywhere}.tv .nx b{overflow-wrap:anywhere}
.md{position:fixed;inset:0;z-index:30;background:rgba(16,21,28,.55);display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 16px}.md[hidden]{display:none}.mdc{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:460px;box-shadow:0 12px 40px rgba(0,0,0,.35)}.mdc input{font-size:1.2rem;margin-bottom:.4rem}
.tk{position:fixed;left:0;right:0;bottom:0;z-index:5;height:4.6vw;min-height:34px;background:var(--blue);color:#fff;overflow:hidden;display:flex;align-items:center;font-weight:700;font-size:max(18px,2.3vw);white-space:nowrap}.tk[hidden]{display:none}
.tk span{display:inline-block;padding-left:100%;animation:tkm linear infinite;will-change:transform}@keyframes tkm{to{transform:translateX(-100%)}}
body.hk .tv{padding-bottom:4.6vw}body.hk .ov,body.hk .tvs{bottom:6vw}
@media (prefers-reduced-motion:reduce){.tk{justify-content:center;white-space:normal;text-align:center}.tk span{padding-left:0;animation:none!important}}
@media (max-width:700px){.cq .cn.nm,.cq.n2 .cn.nm,.cq.n3 .cn.nm{font-size:11vw!important}.nn.nm{font-size:12vw!important}.tk{height:11vw;font-size:4.6vw}body.hk .tv{padding-bottom:11vw}}

const MAXN=99; // al llegar a este número, la numeración vuelve a 01 (además se reinicia cada día)

// Crea un turno. El número lo asigna la base de datos en una transacción: nunca se repite aunque dos computadores generen a la vez.
function mk(p,name){if(!name)return Promise.reject(new Error('Falta el nombre del paciente.'));const k=p?'P':'N',cr=db.doc('cnt/'+day()+'_'+k),tr=db.collection('t').doc();
 return db.runTransaction(async x=>{const c=await x.get(cr),n=((c.exists?c.data().n:0)%MAXN)+1,num=k+'-'+pad(n);
  x.set(cr,{n});x.set(tr,Object.assign({day:day(),k,p:p?1:0,n,num,st:'waiting',created:TS(),mod:null,called:null,cn:0,ns:0},name?{name}:{}));return num})}

let NEWP=0;
function openNew(p){if(!AUTHED||busy)return;NEWP=p?1:0;const m=document.getElementById('md');
 m.innerHTML=`<div class="mdc" role="dialog" aria-modal="true" aria-labelledby="mdt"><h2 id="mdt" style="margin-top:0">Ingresa el nombre del paciente</h2><p class="mut" style="margin:0 0 .6rem">${p?'Turno prioritario':'Turno normal'}</p><input id="pn" maxlength="40" autocomplete="off" placeholder="Ej: Mariano Pérez" onkeydown="if(event.key==='Enter')okNew();if(event.key==='Escape')closeNew()"><p class="err" id="pe"></p><div class="row" style="margin-bottom:0"><button class="b big" onclick="closeNew()">Cancelar</button><button class="b pri big" onclick="okNew()">Generar turno</button></div></div>`;
 m.hidden=false;setTimeout(()=>{const i=$('#pn');i&&i.focus()},30)}

function okNew(){const i=$('#pn'),v=((i||{}).value||'').trim().replace(/\s+/g,' ');
 if(v.length<2){const e=$('#pe');if(e)e.textContent='El nombre del paciente es obligatorio.';i&&i.focus();return}
 if(busy)return;busy=true;setTimeout(()=>{busy=false},900);const p=NEWP;closeNew();
 mk(p,v).then(()=>{lastGen=v;render(true)}).catch(err)}
// Pedir el siguiente: transacción. Si otro consultorio tomó ese turno primero, se intenta con el que sigue.
async function request(i){if(!AUTHED||modOff(i)||act(i)||busyM[i]||(PS[i]&&PS[i].off))return;busyM[i]=1;setTimeout(()=>{busyM[i]=0},1500);
 const tried=[];for(let r=0;r<4;r++){const w=wait().find(t=>!tried.includes(t.id));if(!w)return;tried.push(w.id);const ref=db.doc('t/'+w.id);
  try{const ok=await db.runTransaction(async x=>{const d=await x.get(ref);if(!d.exists||d.data().st!=='waiting')return false;x.update(ref,{st:'called',mod:i,called:TS(),cn:FV().increment(1)});return true});if(ok)return}catch(e){return err(e)}}}
function recall(id){const t=tk(id);if(AUTHED&&t&&t.st==='called')up(id,{called:TS(),cn:FV().increment(1)})}
function fin(id){const t=tk(id);if(AUTHED&&t&&t.st==='called')up(id,{st:'done',end:TS()})}
// No se presentó: la 1.ª vez vuelve al final de la fila; la 2.ª queda cerrado.
function nos(id){const t=tk(id);if(!AUTHED||!t||t.st!=='called')return;up(id,t.ns>=1?{st:'noshow',end:TS()}:{st:'waiting',created:TS(),ns:1,mod:null,called:null})}
function cancelT(id){const t=tk(id);if(AUTHED&&t&&t.st==='waiting')up(id,{st:'cancelled',end:TS()})}
function pause(i){if(AUTHED&&!modOff(i))db.doc('ps/'+i).set({off:!(PS[i]&&PS[i].off)}).catch(err)}
function ask(k,fn){if(armed===k){armed=null;fn();render(true)}else{armed=k;render(true);setTimeout(()=>{if(armed===k){armed=null;render(true)}},4000)}}

function getVoices(){return new Promise(res=>{const vl=speechSynthesis.getVoices();if(vl.length)return res(vl);speechSynthesis.onvoiceschanged=()=>{speechSynthesis.onvoiceschanged=null;res(speechSynthesis.getVoices())};});}
function pickVoice(vl){if(SEL_VOICE){const found=vl.find(x=>x.name===SEL_VOICE);if(found)return found;}const PREF=['es-CO','es-US','es-MX','es-ES'];let v=null;for(const p of PREF){v=vl.find(x=>x.lang.toLowerCase().startsWith(p.toLowerCase()));if(v)break;}if(!v)v=vl.find(x=>/^es[-_]/i.test(x.lang));return v;}
function say(t,done){let e=0;const f=()=>{if(!e){e=1;done()}};setTimeout(f,9000);try{const y=speechSynthesis;y.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-CO';u.rate=.85;u.pitch=1.0;getVoices().then(vl=>{const v=pickVoice(vl);if(v)u.voice=v;u.onend=f;u.onerror=f;y.speak(u)}).catch(()=>{u.onend=f;u.onerror=f;y.speak(u)})}catch(x){f()}}
function beep(){try{ctx.resume();const t=ctx.currentTime;[880,660,880].forEach((f,k)=>{const o=ctx.createOscillator(),g=ctx.createGain(),s=t+k*.3;o.frequency.value=f;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.4,s+.03);g.gain.exponentialRampToValueAtTime(.0001,s+.27);o.start(s);o.stop(s+.3)})}catch(e){}}
// Un llamado a la vez: timbre + voz; cada llamado se ve en pantalla mínimo 4 s y al terminar sale de la lista.
function announce(c){const t0=Date.now();return new Promise(ok=>{const end=()=>sleep(Math.max(0,4000-(Date.now()-t0))).then(ok);if(!snd)return end();beep();setTimeout(()=>say(spk(c),end),900)})}
function pump(){if(CUR||!CQ.length||route()!=='tv'||OWN!==true)return;CUR=CQ.shift();render(true);announce(CUR).then(()=>{CUR=null;render(true);pump()})}
// Detecta llamados nuevos (el contador "cn" del turno sube cada vez que se llama o se vuelve a llamar).
function tick(live){if(route()==='tv'){T.forEach(t=>{const n=t.cn||0;if(live&&!FIRST&&t.st==='called'&&n>(SEEN[t.id]||0)&&!CQ.some(q=>q.id===t.id))CQ.push(Object.assign({},t));SEEN[t.id]=Math.max(SEEN[t.id]||0,n)});if(live)FIRST=false;pump()}render()}
